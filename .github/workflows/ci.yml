name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Ubuntu's official apt package is a full desktop build compiled with
      # librsvg (SVG image) support, unlike purcell/setup-emacs's minimal
      # nix-emacs-ci binaries, which are trimmed for CI speed and drop
      # optional image libraries. Using apt here gets the animated welcome
      # scenes actually rendered and tested, not just skipped.
      - name: Install Emacs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-gtk

      # emacs-plus is a widely-used community formula that bundles librsvg,
      # gnutls, libxml2, etc. by default — the regular Homebrew "emacs"
      # formula was removed from homebrew-core, and even where available
      # historically was not guaranteed to include SVG support.
      - name: Install Emacs (macOS)
        if: runner.os == 'macOS'
        run: |
          brew tap d12frosted/emacs-plus
          brew trust d12frosted/emacs-plus
          brew install emacs-plus@29
          echo "$(brew --prefix)/opt/emacs-plus@29/bin" >> "$GITHUB_PATH"

      - name: Install Emacs (Windows)
        if: runner.os == 'Windows'
        run: choco install emacs -y --no-progress

      - name: Cache Straight packages (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.emacs.d/straight
          key: straight-${{ runner.os }}-svg-${{ hashFiles('init.el') }}

      # Package installs (straight.el cloning many repos back-to-back) can hit
      # transient GitHub network/rate-limit issues on anonymous clones. Using
      # the built-in GITHUB_TOKEN raises the clone rate limit, and the retry
      # loop covers any other one-off network blip.
      - name: First-run init (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          mkdir -p ~/.emacs.d
          cp -r . ~/.emacs.d/
          cd ~/.emacs.d
          for attempt in 1 2 3; do
            emacs --batch -l init.el --eval "(kill-emacs)" && break
            echo "First-run init failed (attempt $attempt/3), retrying..."
            sleep 10
            if [ "$attempt" = 3 ]; then exit 1; fi
          done

      - name: First-run init (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://$env:GH_TOKEN@github.com/".insteadOf "https://github.com/"
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\.emacs.d"
          Copy-Item -Path .\* -Destination "$env:APPDATA\.emacs.d" -Recurse -Force
          cd "$env:APPDATA\.emacs.d"
          $success = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            emacs --batch -l init.el --eval "(kill-emacs)"
            if ($LASTEXITCODE -eq 0) { $success = $true; break }
            Write-Host "First-run init failed (attempt $attempt/3), retrying..."
            Start-Sleep -Seconds 10
          }
          if (-not $success) { exit 1 }

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ~/.emacs.d
          for f in vscode-keys-tests.el editor-session-tests.el welcome-tests.el portability-tests.el command-palette-tests.el; do
            echo "::group::$f"
            emacs --batch -Q -l "$f"
            echo "::endgroup::"
          done

      # NOTE: editor-session-tests.el currently fails 2/6 tests on Windows
      # only (session-desktop-roundtrip-restores-file-and-point and
      # session-empty-start-shows-welcome). This looks like a real
      # cross-platform bug in editor-session.el — state/path handling
      # behaving differently on Windows — not a CI configuration issue.
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd "$env:APPDATA\.emacs.d"
          foreach ($f in @("vscode-keys-tests.el","editor-session-tests.el","welcome-tests.el","portability-tests.el","command-palette-tests.el")) {
            Write-Host "::group::$f"
            emacs --batch -Q -l $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

  test-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run tests inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            # git is required by straight.el's bootstrap (used in init.el)
            # and is NOT preinstalled on the bare FreeBSD VM image, unlike
            # the Linux/macOS/Windows GitHub-hosted runners.
            pkg install -y emacs git
          run: |
            mkdir -p ~/.emacs.d
            cp -r . ~/.emacs.d/
            cd ~/.emacs.d
            for attempt in 1 2 3; do
              emacs --batch -l init.el --eval "(kill-emacs)" && break
              echo "First-run init failed (attempt $attempt/3), retrying..."
              sleep 10
              if [ "$attempt" = 3 ]; then exit 1; fi
            done
            for f in vscode-keys-tests.el editor-session-tests.el welcome-tests.el portability-tests.el command-palette-tests.el; do
              emacs --batch -Q -l "$f"
            done
