name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Emacs (Linux/macOS)
        uses: purcell/setup-emacs@master
        if: runner.os != 'Windows'
        with:
          version: 29.1

      - name: Install Emacs (Windows)
        if: runner.os == 'Windows'
        run: choco install emacs -y --no-progress

      - name: Cache Straight packages (Unix)
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.emacs.d/straight
          key: straight-${{ runner.os }}-29.1-${{ hashFiles('init.el') }}

      - name: First-run init (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p ~/.emacs.d
          cp -r . ~/.emacs.d/
          cd ~/.emacs.d
          emacs --batch -l init.el --eval "(kill-emacs)"

      - name: First-run init (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:APPDATA\.emacs.d"
          Copy-Item -Path .\* -Destination "$env:APPDATA\.emacs.d" -Recurse -Force
          cd "$env:APPDATA\.emacs.d"
          emacs --batch -l init.el --eval "(kill-emacs)"

      # NOTE: welcome-tests.el is currently expected to fail 3/7 tests on both
      # ubuntu-latest and macos-latest here. Root cause: purcell/setup-emacs
      # builds lack librsvg, so "Invalid image type 'svg'" errors on the
      # animated welcome-scene tests. This is an environment limitation, not
      # a workflow bug — fix belongs in welcome-tests.el (skip-unless SVG
      # available) or in swapping how Emacs gets installed on these runners.
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd ~/.emacs.d
          for f in vscode-keys-tests.el editor-session-tests.el welcome-tests.el portability-tests.el command-palette-tests.el; do
            echo "::group::$f"
            emacs --batch -Q -l "$f"
            echo "::endgroup::"
          done

      # NOTE: editor-session-tests.el currently fails 2/6 tests on Windows
      # only (session-desktop-roundtrip-restores-file-and-point and
      # session-empty-start-shows-welcome). This looks like a real
      # cross-platform bug in editor-session.el — state/path handling
      # behaving differently on Windows — not a CI configuration issue.
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd "$env:APPDATA\.emacs.d"
          foreach ($f in @("vscode-keys-tests.el","editor-session-tests.el","welcome-tests.el","portability-tests.el","command-palette-tests.el")) {
            Write-Host "::group::$f"
            emacs --batch -Q -l $f
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "::endgroup::"
          }

  test-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run tests inside FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            # git is required by straight.el's bootstrap (used in init.el)
            # and is NOT preinstalled on the bare FreeBSD VM image, unlike
            # the Linux/macOS/Windows GitHub-hosted runners.
            pkg install -y emacs git
          run: |
            mkdir -p ~/.emacs.d
            cp -r . ~/.emacs.d/
            cd ~/.emacs.d
            emacs --batch -l init.el --eval "(kill-emacs)"
            for f in vscode-keys-tests.el editor-session-tests.el welcome-tests.el portability-tests.el command-palette-tests.el; do
              emacs --batch -Q -l "$f"
            done